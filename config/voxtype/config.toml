# Plasmarchy Voxtype configuration.
#
# Multilingual Parakeet v3 is used for dictation.  The push-to-talk key is F9:
# hold it while speaking and release it to transcribe.  Alt+Space (and the
# Meta+Ctrl+X alias) toggles dictation through KGlobalAccel.
#
# The built-in hotkey reads F9 directly through /dev/input.  The input group
# is required, so log out and back in once after adding the user to it.
state_file = "auto"

engine = "parakeet"

[hotkey]
enabled = true
key = "F9"
mode = "push_to_talk"

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 120
pause_media = true

[parakeet]
# Multilingual Parakeet v3: use the int8 quantization; it is fast enough for
# the AVX2-only CPU on this machine and keeps a low memory footprint.
model = "parakeet-tdt-0.6b-v3-int8"
model_type = "tdt"
on_demand_loading = false

[whisper]
# Retained as a fallback engine.  Keep base model; English and Russian are
# the primary dictation languages.
model = "base"
language = "en,ru"
translate = false

[output]
# Paste mode is layout-independent and works in terminals.  ydotool sends the
# paste keystroke because KDE does not support the wtype virtual-keyboard
# protocol.
mode = "paste"
paste_keys = "shift+insert"
restore_clipboard = true
restore_clipboard_delay_ms = 250
driver_order = ["ydotool"]

[output.notification]
on_recording_start = true
on_recording_stop = true
on_transcription = false